<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 72" width="200" height="72" role="img" aria-label="Sudoku Arcade Logo">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#115e59;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d9488" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="2" y="2" width="196" height="68" rx="16" ry="16"
        fill="url(#logoGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Mini sudoku grid icon -->
  <g transform="translate(16, 16)" fill="none" stroke="white" stroke-width="1.5" opacity="0.95">
    <rect x="0" y="0" width="40" height="40" rx="4" stroke-width="2"/>
    <line x1="0"  y1="13.3" x2="40" y2="13.3" stroke-width="1"/>
    <line x1="0"  y1="26.6" x2="40" y2="26.6" stroke-width="1"/>
    <line x1="13.3" y1="0" x2="13.3" y2="40" stroke-width="1"/>
    <line x1="26.6" y1="0" x2="26.6" y2="40" stroke-width="1"/>
    <circle cx="6.65" cy="6.65" r="3" fill="#2dd4bf" stroke="none"/>
    <circle cx="20"   cy="20"   r="3" fill="#facc15" stroke="none"/>
    <circle cx="33.35" cy="33.35" r="3" fill="#2dd4bf" stroke="none"/>
    <circle cx="33.35" cy="6.65" r="3" fill="white" stroke="none" opacity="0.8"/>
  </g>

  <!-- Text -->
  <text x="68" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14"
        font-weight="900" fill="#ffffff" letter-spacing="1.5"
        text-anchor="start">SUDOKU MASTER</text>
  <text x="68" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5"
        font-weight="700" fill="#99f6e4" letter-spacing="2.2"
        text-anchor="start">BENCHMARK ARCADE</text>
</svg>
