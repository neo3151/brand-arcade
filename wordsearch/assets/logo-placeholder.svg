<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 72" width="200" height="72" role="img" aria-label="Company Logo Placeholder">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2563eb" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="2" y="2" width="196" height="68" rx="14" ry="14"
        fill="url(#logoGrad)" filter="url(#shadow)" />

  <!-- Mini sudoku grid icon -->
  <g transform="translate(14, 16)" fill="none" stroke="white" stroke-width="1.5" opacity="0.9">
    <!-- outer border -->
    <rect x="0" y="0" width="40" height="40" rx="3" stroke-width="2"/>
    <!-- inner grid lines -->
    <line x1="0"  y1="13.3" x2="40" y2="13.3"/>
    <line x1="0"  y1="26.6" x2="40" y2="26.6"/>
    <line x1="13.3" y1="0" x2="13.3" y2="40"/>
    <line x1="26.6" y1="0" x2="26.6" y2="40"/>
    <!-- thick box separators -->
    <line x1="0"  y1="13.3" x2="40" y2="13.3" stroke-width="2.5"/>
    <line x1="0"  y1="26.6" x2="40" y2="26.6" stroke-width="2.5"/>
    <line x1="13.3" y1="0" x2="13.3" y2="40" stroke-width="2.5"/>
    <line x1="26.6" y1="0" x2="26.6" y2="40" stroke-width="2.5"/>
    <!-- a few filled dots to suggest numbers -->
    <circle cx="6.65" cy="6.65" r="3" fill="white" stroke="none"/>
    <circle cx="20"   cy="20"   r="3" fill="white" stroke="none" opacity="0.7"/>
    <circle cx="33.35" cy="33.35" r="3" fill="white" stroke="none"/>
    <circle cx="33.35" cy="6.65" r="3" fill="white" stroke="none" opacity="0.7"/>
    <circle cx="6.65" cy="33.35" r="3" fill="white" stroke="none" opacity="0.5"/>
  </g>

  <!-- Text: LOGO -->
  <text x="68" y="34" font-family="Inter, Arial, sans-serif" font-size="11"
        font-weight="700" fill="rgba(255,255,255,0.65)" letter-spacing="3"
        text-anchor="start">YOUR LOGO HERE</text>
  <text x="68" y="52" font-family="Inter, Arial, sans-serif" font-size="9"
        font-weight="500" fill="rgba(255,255,255,0.45)" letter-spacing="1"
        text-anchor="start">puzzle labs</text>
</svg>
