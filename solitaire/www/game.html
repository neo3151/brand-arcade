<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<script id="arcade-cosmetics-loader">
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  if (parts.length && /\.[a-z0-9]+$/i.test(parts[parts.length - 1])) parts.pop();
  if (parts.length < 1) return;
  var prefix = '';
  for (var i = 0; i < parts.length; i++) prefix += '../';
  document.write(
    '<link rel="stylesheet" href="' + prefix + 'assets/arcade-cosmetics.css">' +
    '<script src="' + prefix + 'assets/arcade-store-config.js"><\/script>' +
    '<script src="' + prefix + 'assets/arcade-store.js"><\/script>' +
    '<script src="' + prefix + 'assets/arcade-store-boot.js"><\/script>' +
    '<script src="' + prefix + 'assets/arcade-cosmetics.js"><\/script>' +
    '<link rel="stylesheet" href="' + prefix + 'assets/arcade-content.css">' +
    '<script src="' + prefix + 'assets/arcade-content.js"><\/script>'
  );
})();
</script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Curious Solitaire — Table</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/mobile-simulator.css">
</head>
<body>
  <!-- Desktop Simulator Controls -->
  <div class="simulator-controls">
    <span class="simulator-badge">GOOGLE PLAY READY</span>
    <button id="btn-toggle-sim" class="simulator-toggle-btn" type="button">🖥️ Full Window</button>
  </div>

  <!-- Outer Smartphone Shell -->
  <div class="device-shell">
    <!-- Virtual Mobile Status Bar -->
    <div class="device-status-bar">
      <span id="device-clock">9:41</span>
      <div class="device-island">
        <div class="device-camera-lens"></div>
      </div>
      <div class="device-status-icons">
        <span>5G</span>
        <span>📶</span>
        <span>100% 🔋</span>
      </div>
    </div>

    <!-- Mobile Viewport Screen -->
    <div class="device-screen">
      <div class="game-container">
    <!-- Top HUD -->
    <header class="game-header">
      <div class="hud-group">
        <a href="index.html" class="btn btn--outline" style="padding: 0.35rem 0.65rem; font-size: 0.82rem;" title="Return to Menu">
          <span>⌂</span> Menu
        </a>
        <div id="hud-deal-title" class="hud-title">Deal #1</div>
      </div>

      <div class="hud-group">
        <div class="hud-item" title="Elapsed Time">
          <span class="hud-item__icon">⏱️</span>
          <span id="hud-timer" class="hud-item__val">00:00</span>
        </div>
        <div class="hud-item" title="Moves Made">
          <span class="hud-item__icon">👣</span>
          <span id="hud-moves" class="hud-item__val">0</span>
        </div>
        <div class="hud-item" title="Score">
          <span class="hud-item__icon">⭐</span>
          <span id="hud-score" class="hud-item__val">0</span>
        </div>
        <button id="btn-sound" class="btn btn--outline btn--icon" style="width: 2rem; height: 2rem;" type="button" title="Toggle Sound">
          <span class="hud-item__icon">🔊</span>
        </button>
        <button id="btn-restart" class="btn btn--outline btn--icon" style="width: 2rem; height: 2rem;" type="button" title="Restart Deal">
          <span>🔄</span>
        </button>
      </div>
    </header>

    <!-- Playing Board -->
    <main class="solitaire-board">
      <!-- Upper Deck (Stock, Waste & Foundations) -->
      <section class="upper-deck">
        <div class="stock-waste-area">
          <div id="stock-slot" class="pile-slot pile-slot--stock" title="Draw Cards"></div>
          <div id="waste-slot" class="pile-slot" style="border-style: none; background: transparent;"></div>
        </div>

        <button id="btn-auto-complete" class="btn-auto-complete" type="button">
          ⚡ Auto-Complete
        </button>

        <div class="foundations-area">
          <div class="pile-slot foundation-slot" data-suit="spades" title="Spades Foundation"></div>
          <div class="pile-slot foundation-slot" data-suit="hearts" title="Hearts Foundation"></div>
          <div class="pile-slot foundation-slot" data-suit="diamonds" title="Diamonds Foundation"></div>
          <div class="pile-slot foundation-slot" data-suit="clubs" title="Clubs Foundation"></div>
        </div>
      </section>

      <!-- Tableau: 7 Columns -->
      <section id="tableau-area" class="tableau-area">
        <div id="tableau-col-0" class="tableau-col tableau-slot" data-col="0"></div>
        <div id="tableau-col-1" class="tableau-col tableau-slot" data-col="1"></div>
        <div id="tableau-col-2" class="tableau-col tableau-slot" data-col="2"></div>
        <div id="tableau-col-3" class="tableau-col tableau-slot" data-col="3"></div>
        <div id="tableau-col-4" class="tableau-col tableau-slot" data-col="4"></div>
        <div id="tableau-col-5" class="tableau-col tableau-slot" data-col="5"></div>
        <div id="tableau-col-6" class="tableau-col tableau-slot" data-col="6"></div>
      </section>
    </main>

    <!-- Hint Message Banner -->
    <div id="hint-banner" class="hint-banner">
      <span style="font-size: 1.4rem;">🔍</span>
      <div id="hint-text" class="hint-banner__text">The Looking Glass reveals a curious path...</div>
      <button id="hint-close" class="hint-banner__close" type="button">&times;</button>
    </div>

    <!-- Footer Controls & Power-Ups -->
    <footer class="game-footer">
      <button id="btn-undo" class="footer-btn" type="button" title="Undo Move">
        <span class="footer-btn__icon">↩️</span>
        <span class="footer-btn__label">Undo</span>
      </button>

      <button id="btn-hint" class="footer-btn" type="button" title="Looking Glass Hint">
        <span class="footer-btn__icon">🔍</span>
        <span class="footer-btn__label">Hint</span>
        <span id="badge-hints" class="footer-badge">0</span>
      </button>

      <button id="btn-peek" class="footer-btn" type="button" title="Cheshire Peek">
        <span class="footer-btn__icon">😸</span>
        <span class="footer-btn__label">Peek</span>
        <span id="badge-peeks" class="footer-badge">0</span>
      </button>

      <button id="btn-shuffle" class="footer-btn" type="button" title="Wonderland Reshuffle">
        <span class="footer-btn__icon">🎩</span>
        <span class="footer-btn__label">Shuffle</span>
        <span id="badge-shuffles" class="footer-badge">0</span>
      </button>

      <a href="store.html" class="footer-btn" style="text-decoration: none;" title="Daily Supply">
        <span class="footer-btn__icon">🗝️</span>
        <span class="footer-btn__label">Supply</span>
      </a>
    </footer>
  </div>

  <!-- Victory Overlay & Canvas -->
  <div id="victory-overlay" class="victory-overlay">
    <canvas id="victory-canvas"></canvas>
    <div class="victory-card">
      <div style="font-size: 3rem; margin-bottom: 0.5rem;">👑🌹</div>
      <h2 class="victory-title">Royal Triumph!</h2>
      <p class="victory-subtitle">The Queen of Hearts nods with whimsical approval!</p>

      <div class="victory-stats-grid">
        <div>
          <div id="victory-time" class="victory-stat-val">00:00</div>
          <div class="victory-stat-lbl">Time</div>
        </div>
        <div>
          <div id="victory-moves" class="victory-stat-val">0</div>
          <div class="victory-stat-lbl">Moves</div>
        </div>
        <div>
          <div id="victory-score" class="victory-stat-val">0</div>
          <div class="victory-stat-lbl">Score</div>
        </div>
      </div>

      <div class="victory-actions">
        <a href="index.html" class="btn btn--outline">
          <span>⌂</span> Menu
        </a>
        <button id="btn-victory-next" class="btn btn--gold" type="button">
          <span>✨</span> Next Deal
        </button>
      </div>
    </div><!-- /#victory-overlay -->

    </div><!-- /.device-screen -->

    <!-- Virtual Home Indicator -->
    <div class="device-home-indicator">
      <div class="device-home-pill"></div>
    </div>
  </div><!-- /.device-shell -->

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/klondike-gen.js"></script>
  <script src="js/solitaire-engine.js"></script>
  <script src="js/hint-engine.js"></script>
  <script src="../../assets/fair-play.js" onerror="this.onerror=null;this.src='../assets/fair-play.js';"></script>
  <script src="js/progress.js"></script>
  <script src="js/store.js"></script>
  <script src="js/game.js"></script>
  <script src="js/mobile-shell.js"></script>
  <script src="../../assets/arcade-nav.js" onerror="this.onerror=null;this.src='../assets/arcade-nav.js';"></script>
  <script src="js/curated-deals.js"></script>
</body>
</html>
