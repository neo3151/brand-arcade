<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Curious Solitaire — Daily Supply</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/mobile-simulator.css">
</head>
<body>
  <!-- Desktop Simulator Controls -->
  <div class="simulator-controls">
    <span class="simulator-badge">GOOGLE PLAY READY</span>
    <button id="btn-toggle-sim" class="simulator-toggle-btn" type="button">🖥️ Full Window</button>
  </div>

  <!-- Outer Smartphone Shell -->
  <div class="device-shell">
    <!-- Virtual Mobile Status Bar -->
    <div class="device-status-bar">
      <span id="device-clock">9:41</span>
      <div class="device-island">
        <div class="device-camera-lens"></div>
      </div>
      <div class="device-status-icons">
        <span>5G</span>
        <span>📶</span>
        <span>100% 🔋</span>
      </div>
    </div>

    <!-- Mobile Viewport Screen -->
    <div class="device-screen">
      <div class="menu-container" style="max-width: 440px;">
    <!-- Top Bar -->
    <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="btn btn--outline" style="padding: 0.4rem 0.8rem;">
        <span>&larr;</span> Return
      </a>
      <div class="hud-item" style="font-size: 1.1rem; color: var(--gold-400); font-family: var(--font-serif);">
        <span>🗝️</span> Daily Supply
      </div>
    </div>

    <!-- Inventory Bar -->
    <div class="stats-strip" style="width: 100%;">
      <div>
        <div id="store-hints-count" class="stats-strip__val">0</div>
        <div class="stats-strip__lbl">Looking Glass Hints 🔍</div>
      </div>
      <div>
        <div id="store-peeks-count" class="stats-strip__val">0</div>
        <div class="stats-strip__lbl">Cheshire Peeks 😸</div>
      </div>
      <div>
        <div id="store-shuffles-count" class="stats-strip__val">0</div>
        <div class="stats-strip__lbl">Reshuffles 🎩</div>
      </div>
    </div>

    <!-- Banner -->
    <div style="text-align: center;">
      <h1 class="menu-title" style="font-size: 2.2rem;">Morning Supply</h1>
      <p class="menu-subtitle">Hints, peeks, and reshuffles refill every local morning.</p>
    </div>

    <!-- Daily supply status -->
    <div id="store-grid" class="store-packages-grid"></div>

    <div style="text-align: center; max-width: 580px; font-size: 0.8rem; color: #94a3b8; line-height: 1.5; margin-top: 1rem; border-top: 1px solid rgba(212, 175, 55, 0.2); padding-top: 1rem;">
      <p>This game is 100% free and ad-free. Supplies are stored on this device.</p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="../../assets/fair-play.js" onerror="this.onerror=null;this.src='../assets/fair-play.js';"></script>
  <script src="js/progress.js"></script>
  <script src="js/store.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.SolitaireStore.renderDailySupply(document.getElementById('store-grid'));
    });
  </script>
    </div><!-- /.device-screen -->

    <!-- Virtual Home Indicator -->
    <div class="device-home-indicator">
      <div class="device-home-pill"></div>
    </div>
  </div><!-- /.device-shell -->

  <script src="js/mobile-shell.js"></script>
  <script src="../../assets/arcade-nav.js" onerror="this.onerror=null;this.src='../assets/arcade-nav.js';"></script>
</body>
</html>
