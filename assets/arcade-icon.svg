<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#10b981" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1.5">
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
  </g>

  <!-- Arcade Game Controller Silhouette -->
  <g filter="url(#shadow)">
    <!-- Controller Body -->
    <path d="M168 184 C112 184, 88 224, 88 280 C88 344, 128 384, 168 384 C192 384, 216 352, 256 352 C296 352, 320 384, 344 384 C384 384, 424 344, 424 280 C424 224, 400 184, 344 184 Z" 
          fill="#1e293b" stroke="url(#glowGrad)" stroke-width="8"/>
    
    <!-- D-Pad -->
    <path d="M152 248 H176 V224 H200 V248 H224 V272 H200 V296 H176 V272 H152 Z" fill="#334155" stroke="#94a3b8" stroke-width="3"/>

    <!-- Action Buttons -->
    <circle cx="340" cy="240" r="14" fill="url(#goldGrad)"/>
    <circle cx="368" cy="268" r="14" fill="#ef4444"/>
    <circle cx="312" cy="268" r="14" fill="#3b82f6"/>
    <circle cx="340" cy="296" r="14" fill="url(#glowGrad)"/>

    <!-- Center Brand Gem -->
    <circle cx="256" cy="260" r="10" fill="url(#glowGrad)"/>
  </g>

  <!-- Crown / Star Accent -->
  <path d="M256 100 L266 124 L292 128 L273 146 L278 172 L256 160 L234 172 L239 146 L220 128 L246 124 Z" fill="url(#goldGrad)"/>
</svg>
