<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<script id="arcade-cosmetics-loader">
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  if (parts.length && /\.[a-z0-9]+$/i.test(parts[parts.length - 1])) parts.pop();
  if (parts.length < 1) return;
  var prefix = '';
  for (var i = 0; i < parts.length; i++) prefix += '../';
  document.write(
    '<link rel="stylesheet" href="' + prefix + 'assets/arcade-cosmetics.css">' +
    '<script src="' + prefix + 'assets/arcade-store-config.js"><\/script>' +
    '<script src="' + prefix + 'assets/arcade-store.js"><\/script>' +
    '<script src="' + prefix + 'assets/arcade-store-boot.js"><\/script>' +
    '<script src="' + prefix + 'assets/arcade-cosmetics.js"><\/script>'
  );
})();
</script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Timber Block Blast — Themes & Supply</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/mobile-simulator.css">
  <link rel="stylesheet" href="css/store.css">
</head>
<body>
  <div class="device-wrapper">
    <div class="device-shell">
      <!-- Status Bar -->
      <div class="device-status-bar">
        <span id="device-clock">12:00</span>
        <div class="device-camera-cutout"></div>
        <div class="device-status-icons">
          <button id="sound-toggle-btn" class="sound-toggle-btn" aria-label="Toggle Sound">🔊</button>
          <span>100%</span>
        </div>
      </div>

      <!-- Main Store Viewport -->
      <div class="device-screen">
        <div class="store-viewport">
          <header class="store-top-bar">
            <h1 class="store-title">Themes & Supply</h1>
            <div style="display:flex;align-items:center;gap:0.6rem;">
              <div style="background:rgba(0,0,0,0.4);border:1px solid var(--amber-gold);padding:0.35rem 0.7rem;border-radius:12px;font-family:var(--font-mono);font-size:0.85rem;color:var(--amber-light);font-weight:800;">
                🪙 <span id="store-coins">150</span>
              </div>
              <a href="index.html" class="btn btn--secondary" style="padding:0.4rem 0.75rem;font-size:0.8rem;">
                ✕
              </a>
            </div>
          </header>

          <div id="supply-status" style="background:rgba(245, 158, 11, 0.12);border:1px dashed var(--amber-gold);border-radius:14px;padding:0.65rem 0.85rem;margin-bottom:1rem;font-size:0.75rem;color:var(--amber-light);line-height:1.4;"></div>

          <div class="store-section-title">Daily Supply</div>
          <div class="packs-grid" id="supply-grid"></div>

          <!-- Board & Block Themes -->
          <div class="store-section-title">Visual Themes</div>
          <div class="themes-grid" id="themes-grid">
            <!-- Populated dynamically -->
          </div>

          <div id="paid-cosmetic-shelf"></div>
<footer style="margin-top:auto;text-align:center;">
            <p class="store-legal">Themes are bought with coins you earn by playing. This game is 100% free and ad-free.</p>
          </footer>
        </div>
      </div><!-- /.device-screen -->

      <!-- Home Indicator -->
      <div class="device-home-indicator">
        <div class="device-home-pill"></div>
      </div>
    </div><!-- /.device-shell -->
  </div><!-- /.device-wrapper -->

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/audio.js"></script>
  <script src="../../assets/fair-play.js" onerror="this.onerror=null;this.src='../assets/fair-play.js';"></script>
  <script src="js/progress.js"></script>
  <script src="js/mobile-shell.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const themes = [
        { id: 'timber', name: 'Timber Oak', cost: 0, preview: ['#d97706', '#b45309', '#f59e0b', '#78350f'] },
        { id: 'neon', name: 'Neon Cyber', cost: 150, preview: ['#06b6d4', '#ec4899', '#8b5cf6', '#10b981'] },
        { id: 'jewel', name: 'Royal Jewels', cost: 200, preview: ['#ef4444', '#3b82f6', '#10b981', '#f59e0b'] },
        { id: 'slate', name: 'Pastel Slate', cost: 150, preview: ['#64748b', '#94a3b8', '#cbd5e1', '#475569'] },
        { id: 'aurora', name: 'Aurora Borealis', cost: 0, preview: ['#22d3ee', '#a78bfa', '#34d399', '#6366f1'] }
      ];

      function updateCoinsDisplay() {
        document.getElementById('store-coins').textContent = window.Progress.getCoins();
      }

      function renderSupply() {
        const ups = window.Progress.getPowerups();
        const status = document.getElementById('supply-status');
        if (status) {
          status.textContent = window.FairPlay
            ? window.FairPlay.supplySummary('blockblast')
            : 'Hammers, rotates, and rerolls refill every morning.';
        }
        const grid = document.getElementById('supply-grid');
        if (!grid) return;
        const items = [
          { icon: '🔨', name: 'Hammers', count: ups.hammer },
          { icon: '🔄', name: 'Rotates', count: ups.rotate },
          { icon: '🎲', name: 'Rerolls', count: ups.reroll }
        ];
        grid.innerHTML = '';
        items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'pack-card';
          const info = document.createElement('div');
          info.className = 'pack-info';
          const icon = document.createElement('span');
          icon.className = 'pack-icon';
          icon.textContent = item.icon;
          const copy = document.createElement('div');
          const title = document.createElement('div');
          title.className = 'pack-title';
          title.textContent = item.name;
          const desc = document.createElement('div');
          desc.className = 'pack-desc';
          desc.textContent = item.count + ' ready';
          copy.appendChild(title);
          copy.appendChild(desc);
          info.appendChild(icon);
          info.appendChild(copy);
          card.appendChild(info);
          grid.appendChild(card);
        });
      }

      function renderThemes() {
        const grid = document.getElementById('themes-grid');
        grid.innerHTML = '';

        const unlocked = window.Progress.getUnlockedThemes();
        const selected = window.Progress.getSelectedTheme();
        const paidOn = window.ArcadeCosmetics && window.ArcadeCosmetics.equippedId
          ? window.ArcadeCosmetics.equippedId('blockblast')
          : '';

        themes.forEach(th => {
          const isUnlocked = unlocked.includes(th.id);
          const isSelected = !paidOn && selected === th.id;

          const card = document.createElement('div');
          card.className = `theme-card ${isSelected ? 'active' : ''}`;

          const previewEl = document.createElement('div');
          previewEl.className = 'theme-preview';
          previewEl.style.background = '#1a0e07';
          th.preview.forEach(color => {
            const block = document.createElement('div');
            block.style.background = color;
            block.style.borderRadius = '3px';
            previewEl.appendChild(block);
          });

          const nameEl = document.createElement('div');
          nameEl.className = 'theme-name';
          nameEl.textContent = th.name;

          const actionBtn = document.createElement('button');
          if (isSelected) {
            actionBtn.className = 'btn btn--secondary';
            actionBtn.style.padding = '0.35rem 0.65rem';
            actionBtn.style.fontSize = '0.75rem';
            actionBtn.textContent = '✓ Active';
            actionBtn.disabled = true;
          } else if (isUnlocked) {
            actionBtn.className = 'btn btn--primary';
            actionBtn.style.padding = '0.35rem 0.65rem';
            actionBtn.style.fontSize = '0.75rem';
            actionBtn.textContent = 'Equip';
            actionBtn.addEventListener('click', () => {
              window.Progress.setSelectedTheme(th.id);
              renderThemes();
              window.Utils.showToast(`Equipped ${th.name} theme!`, 'success');
            });
          } else {
            actionBtn.className = 'btn btn--primary';
            actionBtn.style.padding = '0.35rem 0.65rem';
            actionBtn.style.fontSize = '0.75rem';
            actionBtn.textContent = `${th.cost} 🪙`;
            actionBtn.addEventListener('click', () => {
              if (window.Progress.spendCoins(th.cost)) {
                window.Progress.unlockTheme(th.id);
                window.Progress.setSelectedTheme(th.id);
                updateCoinsDisplay();
                renderThemes();
                window.Utils.showToast(`Unlocked & equipped ${th.name}!`, 'success');
              } else {
                window.Utils.showToast('Not enough coins!', 'warning');
              }
            });
          }

          card.appendChild(previewEl);
          card.appendChild(nameEl);
          card.appendChild(actionBtn);
          grid.appendChild(card);
        });
      }

      updateCoinsDisplay();
      renderSupply();
      renderThemes();
      if (window.ArcadeCosmetics && window.ArcadeCosmetics.on) {
        window.ArcadeCosmetics.on('change', renderThemes);
      }
    });
  </script>
  <script src="../../assets/arcade-nav.js" onerror="this.onerror=null;this.src='../assets/arcade-nav.js';"></script>
</body>
</html>
