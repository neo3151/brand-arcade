<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 72" width="200" height="72" role="img" aria-label="Word Search Arcade Logo">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.9" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded pill badge -->
  <rect x="2" y="2" width="196" height="68" rx="16" ry="16"
        fill="url(#badgeGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" filter="url(#badgeShadow)" />

  <!-- Word Search 3x3 letter grid icon -->
  <g transform="translate(16, 15)">
    <!-- Tile 1 (W) -->
    <rect x="0" y="0" width="18" height="18" rx="4" fill="rgba(255,255,255,0.18)"/>
    <text x="9" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">W</text>

    <!-- Tile 2 (O) -->
    <rect x="21" y="0" width="18" height="18" rx="4" fill="rgba(255,255,255,0.18)"/>
    <text x="30" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">O</text>

    <!-- Tile 3 (R) -->
    <rect x="0" y="21" width="18" height="18" rx="4" fill="rgba(255,255,255,0.18)"/>
    <text x="9" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">R</text>

    <!-- Tile 4 (D) with highlight -->
    <rect x="21" y="21" width="18" height="18" rx="4" fill="url(#highlightGrad)"/>
    <text x="30" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#0f172a" text-anchor="middle">D</text>

    <!-- Connection search ray -->
    <circle cx="9" cy="9" r="4" fill="#38bdf8" opacity="0.8"/>
    <circle cx="30" cy="30" r="4" fill="#facc15" opacity="0.9"/>
  </g>

  <!-- Typography -->
  <text x="68" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5"
        font-weight="900" fill="#ffffff" letter-spacing="1.5"
        text-anchor="start">WORD SEARCH</text>
  <text x="68" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5"
        font-weight="700" fill="#93c5fd" letter-spacing="2.2"
        text-anchor="start">BENCHMARK ARCADE</text>
</svg>
