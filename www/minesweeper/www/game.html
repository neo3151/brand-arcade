<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Inferno Sweeper: Operational Combat Zone. Neutralize demonic plasma mines and cleanse the quarantine sector." />
  <title>INFERNO SWEEPER — Operational Sector</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/game.css" />
  <link rel="stylesheet" href="css/mobile-simulator.css" />
</head>
<body class="game-page">
  <!-- Desktop Simulator Controls -->
  <div class="simulator-controls">
    <span class="simulator-badge">GOOGLE PLAY READY</span>
    <button id="btn-toggle-sim" class="simulator-toggle-btn" type="button">🖥️ Full Window</button>
  </div>

  <!-- Outer Smartphone Shell -->
  <div class="device-shell">
    <!-- Virtual Mobile Status Bar -->
    <div class="device-status-bar">
      <span id="device-clock">10:30</span>
      <div class="device-island">
        <div class="device-camera-lens"></div>
      </div>
      <div class="device-status-icons">
        <span>5G</span>
        <span>📶</span>
        <span>100% 🔋</span>
      </div>
    </div>

    <!-- Mobile Viewport Screen -->
    <div class="device-screen">
      <!-- Tactical Command HUD -->
  <header class="hud-bar">
    <!-- Left: Navigation & Mission Details -->
    <div class="hud-group">
      <button class="btn btn--sm" id="back-btn" aria-label="Return to Command Base">
        ← Base
      </button>
      <div>
        <div class="hud-title" id="hud-mission-title">Phobos Outpost</div>
        <div class="hud-subtitle">QUARANTINE SECTOR</div>
      </div>
    </div>

    <!-- Center: Mines LED, Marine Status Mugshot, Timer LED -->
    <div class="hud-group">
      <div class="led-display" id="led-mines" aria-label="Plasma mines remaining">010</div>
      
      <button class="face-btn" id="face-btn" aria-label="Restart Mission / Marine Status">
        <!-- Injected via utils.js / game.js -->
      </button>

      <div class="led-display" id="led-timer" aria-label="Mission elapsed time">000</div>
    </div>

    <!-- Right: Sound Toggle & Armory Link -->
    <div class="hud-group">
      <button class="btn btn--sm btn--icon" id="sound-toggle-btn" aria-label="Toggle Audio Effects">
        🔊
      </button>
      <a href="store.html" class="btn btn--cyan btn--sm" aria-label="View daily supply">
        🛡️ Supply
      </a>
    </div>
  </header>

  <!-- ======================================================
       Battlefield Grid Viewport
       ====================================================== -->
  <main class="grid-viewport" id="grid-viewport">
    <div class="grid-frame">
      <div class="mine-grid" id="mine-grid" role="grid" aria-label="Demonic minefield grid">
        <!-- Cells generated by game.js -->
      </div>
    </div>
  </main>

  <!-- ======================================================
       Tactical Power-Up & Quick Action Toolbar
       ====================================================== -->
  <footer class="action-bar">
    <!-- Mobile Dig vs Flag mode toggle -->
    <div class="mode-toggle" aria-label="Touch Mode Switcher">
      <button class="mode-btn is-active" id="mode-dig" aria-label="Dig Mode (Uncover cells)">
        <span>⛏️</span> <span>DIG</span>
      </button>
      <button class="mode-btn mode-btn--flag" id="mode-flag" aria-label="Flag Mode (Place warning markers)">
        <span>🚩</span> <span>FLAG</span>
      </button>
    </div>

    <!-- Power-Ups Quickbar -->
    <div class="power-items" aria-label="Tactical Power-Up Supplies">
      <button class="power-btn" id="power-shield" title="Bio-Shield: Absorbs 1 lethal mine detonation">
        <span class="power-btn__icon">🛡️</span>
        <span class="power-btn__badge">0</span>
      </button>
      <button class="power-btn" id="power-sonar" title="Hell-Scan: Sweeps a 3x3 sector safely">
        <span class="power-btn__icon">📡</span>
        <span class="power-btn__badge">0</span>
      </button>
      <button class="power-btn" id="power-orb" title="Tactical AI: Highlights a 100% safe tile">
        <span class="power-btn__icon">👁️</span>
        <span class="power-btn__badge">0</span>
      </button>
      <button class="power-btn" id="power-strike" title="Orbital EMP: Disarms 3 random hidden mines">
        <span class="power-btn__icon">🚀</span>
        <span class="power-btn__badge">0</span>
      </button>
    </div>
  </footer>

  <!-- ======================================================
       Victory Modal
       ====================================================== -->
  <div class="modal-backdrop" id="victory-modal" role="dialog" aria-modal="true">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title"><span>🔥</span> Sector Cleansed!</div>
      </div>
      <div class="modal-body">
        <p style="font-size:1.1rem;color:#4ade80;font-weight:700;">
          All demonic threat vectors neutralized. Quarantine lockdown lifted.
        </p>
        <div style="background:#11141b;border:1px solid var(--border-metal);border-radius:4px;padding:var(--space-4);display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-3);text-align:center;">
          <div>
            <div style="font-size:0.75rem;color:var(--color-text-muted);font-family:var(--font-mono);">TIME</div>
            <div style="font-size:1.5rem;font-weight:900;color:#fff;font-family:var(--font-display);" id="vic-time">0s</div>
          </div>
          <div>
            <div style="font-size:0.75rem;color:var(--color-text-muted);font-family:var(--font-mono);">BEST</div>
            <div style="font-size:1.5rem;font-weight:900;color:var(--color-plasma-cyan);font-family:var(--font-display);" id="vic-best">0s</div>
          </div>
          <div>
            <div style="font-size:0.75rem;color:var(--color-text-muted);font-family:var(--font-mono);">STREAK</div>
            <div style="font-size:1.5rem;font-weight:900;color:var(--color-hazard-yellow);font-family:var(--font-display);" id="vic-streak">1</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn--sm" id="vic-menu-btn">Command Base</button>
        <button class="btn btn--primary btn--sm" id="vic-next-btn">Re-engage Sector →</button>
      </div>
  </div><!-- /.device-screen -->

  <!-- Virtual Home Indicator -->
  <div class="device-home-indicator">
    <div class="device-home-pill"></div>
  </div>
</div><!-- /.device-shell -->

  <!-- Scripts -->
  <script src="../../assets/fair-play.js" onerror="this.onerror=null;this.src='../assets/fair-play.js';"></script>
  <script src="js/progress.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/minesweeper-gen.js"></script>
  <script src="js/game.js"></script>
  <script src="js/mobile-shell.js"></script>
  <script src="../../assets/arcade-nav.js" onerror="this.onerror=null;this.src='../assets/arcade-nav.js';"></script>
</body>
</html>
